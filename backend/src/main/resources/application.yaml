server:
  port: 8080
  # servlet:
  #   context-path: /identity

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5432/identity_service}
    driverClassName: "org.postgresql.Driver"
    password: ${DBMS_PASSWORD:identity_password}
    username: ${DBMS_USERNAME:identity_user}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"
  valid-duration: 3600 # in second
  refreshable-duration: 36000 # in seconds

spring.servlet.multipart:
  enabled: true
  max-file-size: 50MB       # video giới thiệu (tối đa 50MB theo UC-T01)
  max-request-size: 60MB

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  bucket: ${S3_BUCKET:englishpath}
  access-key: ${S3_ACCESS_KEY:minio_user}
  secret-key: ${S3_SECRET_KEY:minio_password_123}
  region: ${S3_REGION:us-east-1}
  path-style-access-enabled: true  # BẮT BUỘC cho MinIO
