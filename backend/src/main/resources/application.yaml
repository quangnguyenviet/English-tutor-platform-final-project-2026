server:
  port: 8080
  # servlet:
  #   context-path: /identity

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DBMS_CONNECTION:jdbc:postgresql://localhost:5432/identity_service}
    driverClassName: "org.postgresql.Driver"
    password: ${DBMS_PASSWORD:identity_password}
    username: ${DBMS_USERNAME:identity_user}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"
  valid-duration: 3600 # in second
  refreshable-duration: 36000 # in seconds

spring.servlet.multipart:
  enabled: true
  max-file-size: 50MB       # video giới thiệu (tối đa 50MB theo UC-T01)
  max-request-size: 60MB

app:
  payment:
    default-fee-percentage: 40   # Tỷ lệ phí nhận lớp mặc định (%)
    min-fee-percentage: 0        # Khoảng Lễ tân / Admin được chỉnh
    max-fee-percentage: 50
    proof-max-bytes: 5242880     # Biên lai tối đa 5 MB
    proof-allowed-types: image/jpeg,image/png,application/pdf
  elo:
    k: 32                         # Hệ số K
    initial-elo: 1000             # Elo khởi điểm của học sinh
    default-question-rating: 1000 # Câu không gắn CEFR
    cefr-ratings: {A1: 800, A2: 1000, B1: 1200, B2: 1400, C1: 1600, C2: 1800}
  ai:
    # AI Service (FastAPI) — AD-2: backend là cổng duy nhất gọi AI.
    # Chạy AI ngoài Docker (local): http://localhost:8000; full docker: http://ai:8000
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}   # UC-T06: quá 60s → "Thử lại"
  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      issuer: https://accounts.google.com
      redirect-uris: ${GOOGLE_OAUTH_REDIRECT_URIS:http://localhost:5173/auth/google/callback}

  messaging:
    # Rocket.Chat chỉ là kho tin nhắn; mọi thao tác ghi đi qua backend (không cấp token cho trình duyệt).
    rocketchat:
      base-url: ${ROCKETCHAT_URL:http://localhost:3001}
      admin-username: ${ROCKETCHAT_ADMIN_USERNAME:ep_admin}
      admin-password: ${ROCKETCHAT_ADMIN_PASSWORD:ChangeMe123!}
      create-tokens-secret: ${ROCKETCHAT_CREATE_TOKENS_SECRET:dev-only-change-me}
      connect-timeout-ms: 2000
      read-timeout-ms: 15000
      max-retries: 2
    proposal-expire-days: 7
    max-messages-per-minute: 10
    max-message-length: 2000
    internal-hmac-secret: ${MESSAGING_INTERNAL_HMAC_SECRET:dev-only-change-me-hmac}
    jobs-enabled: ${MESSAGING_JOBS_ENABLED:true}

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  bucket: ${S3_BUCKET:englishpath}
  access-key: ${S3_ACCESS_KEY:minio_user}
  secret-key: ${S3_SECRET_KEY:minio_password_123}
  region: ${S3_REGION:us-east-1}
  path-style-access-enabled: true  # BẮT BUỘC cho MinIO
  # Các thư mục cho phép đọc công khai để hiển thị trực tiếp trên trình duyệt.
  public-read-prefixes: avatars,credentials
